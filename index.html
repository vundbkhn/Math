<style>
:root{--bg:#eaf1ff;--ink:#1e2a52;--blue:#2f6fe4;--card:#fff;--soft:#f3f6ff;--line:#d5e0fa;--green:#5fd68a;--red:#ff8f8f;--org:#ff8a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg) radial-gradient(#cfdcf7 1.5px,transparent 1.5px) 0 0/26px 26px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
.screen{display:none;min-height:100%;padding:18px;max-width:1100px;margin:auto}
.screen.on{display:block}
h1{margin:6px 0 2px;font-size:clamp(26px,5vw,40px);text-align:center}
h2{font-size:20px;margin:22px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:0 3px 10px #2f6fe422;border:0;color:var(--ink);font-size:17px;cursor:pointer;font-family:inherit}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border-radius:26px;padding:14px;box-shadow:0 6px 18px #2f6fe426;border:4px solid transparent;cursor:pointer;text-align:center;font-weight:800;font-size:19px;transition:.15s;font-family:inherit;color:var(--ink)}
.card:active{transform:scale(.96)}
.card.sel{border-color:var(--blue);background:#f4f8ff}
.card .ic{font-size:64px;line-height:1.1;background:var(--soft);border-radius:20px;padding:12px;margin-bottom:8px}
.ranges{display:flex;gap:10px;flex-wrap:wrap}
.ranges .pill{flex:1;min-width:120px;border:4px solid transparent}
.ranges .pill.sel{border-color:var(--blue);background:#f4f8ff}
.big{display:block;width:100%;margin-top:22px;padding:16px;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(#3b7cf0,#2259cf);border:0;border-radius:999px;box-shadow:0 6px 0 #1a46a6;cursor:pointer;font-family:inherit}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #1a46a6}
.big.alt{background:#fff;color:var(--ink);box-shadow:0 4px 12px #2f6fe426;margin-top:12px;font-size:18px}
/* game */
.game{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:calc(100vh - 36px)}
.left{background:linear-gradient(#7cc8ff,#c9ecff 60%,#c8ee9a 60%);border-radius:30px;position:relative;overflow:hidden;min-height:320px;box-shadow:0 6px 18px #2f6fe426}
.bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:2}
.prog{flex:1;height:16px;background:#eaf1ff;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#4a7de8;border-radius:99px;transition:.4s}
#scene{position:absolute;inset:0;overflow:hidden}
#scene .a{position:absolute;line-height:1;transform:translate(-50%,-50%);transition:left .6s,top .6s,opacity .4s,font-size .5s}
.dim{opacity:.35}
.pop{animation:bloom .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bloom{from{transform:translate(-50%,-50%) scale(0) rotate(-90deg)}to{transform:translate(-50%,-50%) scale(1)}}
.shake{animation:sh .4s}
@keyframes sh{25%{margin-left:-10px}75%{margin-left:10px}}
.hop{animation:hop .6s}
@keyframes hop{30%{margin-top:-24px}60%{margin-top:0}}
.lbl{position:absolute;bottom:10px;right:12px;background:#ffffffd9;border-radius:99px;padding:4px 12px;font-weight:800;font-size:13px;z-index:2}
#toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:99px;font-weight:900;color:#fff;background:#2fb766;box-shadow:0 0 14px #2fb76699;opacity:0;transition:.25s;white-space:nowrap;z-index:3}
#toast.show{opacity:1}#toast.bad{background:#e35d5d;box-shadow:none}
.right{background:#fff;border-radius:30px;padding:16px;box-shadow:0 6px 18px #2f6fe426}
.q{border:2px solid var(--line);border-radius:26px;padding:22px 12px;text-align:center;position:relative;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.q .t{font-size:clamp(34px,6vw,54px);font-weight:900;color:#3a63c8}
.q .s{font-size:18px;font-weight:800;color:#6a7aa8}
.q .em{font-size:clamp(28px,4.5vw,40px);line-height:1.25;word-break:break-all}
.spk{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;border:0;background:var(--soft);font-size:20px;cursor:pointer}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.opt{padding:22px 4px;font-size:clamp(26px,4.5vw,40px);font-weight:900;background:var(--soft);border:2px solid var(--line);border-radius:22px;cursor:pointer;color:var(--ink);font-family:inherit}
.opt:active{transform:scale(.96)}
.opt.ok{background:var(--green);color:#fff;border-color:var(--green)}
.opt.no{background:var(--red);color:#fff;border-color:var(--red)}
.res{text-align:center}
.res .face{font-size:110px}
.res .st{font-size:70px;letter-spacing:6px;margin:8px 0}
.res .gain{background:#fff3d6;border-radius:24px;padding:16px;font-weight:900;font-size:22px;color:#a0481a;margin-top:12px}
@media(max-width:760px){.game{grid-template-columns:1fr}.left{min-height:300px}}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.glow{animation:glow .5s infinite alternate;cursor:pointer}
@keyframes glow{from{filter:drop-shadow(0 0 3px #fff) brightness(1)}to{filter:drop-shadow(0 0 16px #ffd400) brightness(1.35)}}
.card small{display:block;font-size:13px;color:#6a7aa8;font-weight:700;margin-top:2px}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <div class="top">
    <button class="pill" id="musicBtn">🎵 Nhạc: Bật</button>
    <div class="pill">⭐ <span id="total">0</span></div>
  </div>
  <h1>🤖 Bé Học Toán</h1>
  <h2>Chọn bài học</h2>
  <div class="grid g4" id="topics"></div>
  <h2>Chọn phạm vi</h2>
  <div class="ranges" id="ranges"></div>
  <button class="big alt" id="resume" style="display:none"></button>
  <button class="big" id="start">Bắt đầu!</button>
</section>

<!-- GAME -->
<section id="play" class="screen">
  <div class="game">
    <div class="left">
      <div class="bar">
        <button class="pill" id="quit" style="padding:8px 14px">✕</button>
        <div class="prog"><i id="pg"></i></div>
        <div class="pill" style="padding:6px 14px">⭐ <span id="sc">0</span></div>
      </div>
      <div id="toast"></div>
      <div id="scene"></div>
    </div>
    <div class="right">
      <div class="q">
        <button class="spk" id="spk" title="Đọc câu hỏi">🔊</button>
        <div class="s" id="qs"></div>
        <div class="em" id="qem"></div>
        <div class="t" id="qt"></div>
      </div>
      <div class="opts" id="opts"></div>
    </div>
  </div>
</section>

<!-- RESULT -->
<section id="done" class="screen">
  <div class="res" style="max-width:560px;margin:auto">
    <div class="face">🤖</div>
    <h1 id="rt">Giỏi quá!</h1>
    <div id="rs" style="font-weight:700;color:#6a7aa8"></div>
    <div class="st" id="rst"></div>
    <div id="rn" style="font-weight:900;font-size:20px"></div>
    <div class="gain">⭐ +<span id="rg">0</span> sao</div>
    <button class="big" id="again">Chơi lại</button>
    <button class="big alt" id="home2">Về nhà</button>
  </div>
</section>

<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const TOPICS=[{id:'count',n:'Tập đếm',i:'🍎'},{id:'cmp',n:'So sánh',i:'⚖️'},{id:'add',n:'Phép cộng',i:'➕'},{id:'sub',n:'Phép trừ',i:'➖'}];
const RANGES=[10,20,100,1000];
let topic='count',range=10,qs=[],idx=0,score=0,locked=false;
const SAVE='beHocToan.v1';
let S={stars:0,topic:'count',range:10,stats:{},game:null};
try{const o=JSON.parse(localStorage.getItem(SAVE));if(o)Object.assign(S,o);else{const old=+localStorage.getItem('mathStars');if(old)S.stars=old}}catch(e){}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
topic=S.topic;range=S.range;let res=[];

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function buildHome(){
  $('total').textContent=S.stars;
  $('topics').innerHTML=TOPICS.map(t=>{const o=S.stats[t.id+'-'+range];return `<button class="card ${t.id===topic?'sel':''}" data-t="${t.id}"><div class="ic">${t.i}</div>${t.n}<small>${o?`Cao nhất ${o.best}/10 · ${o.plays} lượt`:'Chưa học'}</small></button>`}).join('');
  $('ranges').innerHTML=RANGES.map(r=>`<button class="pill ${r===range?'sel':''}" data-r="${r}">Phạm vi ${r}</button>`).join('');
  const g=S.game,rb=$('resume');
  if(g&&g.idx<10){rb.style.display='block';rb.textContent=`▶ Học tiếp: ${TOPICS.find(t=>t.id===g.topic).n} · phạm vi ${g.range} (câu ${g.idx+1}/10)`}else rb.style.display='none';
}
$('topics').onclick=e=>{const b=e.target.closest('[data-t]');if(b){topic=S.topic=b.dataset.t;save();buildHome()}};
$('ranges').onclick=e=>{const b=e.target.closest('[data-r]');if(b){range=S.range=+b.dataset.r;save();buildHome()}};

/* ---------- Câu hỏi ---------- */
const EMO=['🍎','🐟','⭐','🐥','🌸','🚗','🎈','🍓'];
function opts3(c,max){
  const step=max>=100?(max>=1000?rnd(1,3)*10:rnd(1,3)):1,s=new Set([c]);let g=0;
  while(s.size<3&&g++<50){const d=(rnd(1,3))*(Math.random()<.5?1:step||1)*(Math.random()<.5?-1:1);const v=c+d;if(v>=0&&v<=max)s.add(v)}
  let k=0;while(s.size<3)s.add(c+(++k));
  return shuffle([...s]);
}
function makeQ(){
  if(topic==='count'){
    if(range<=20){const n=rnd(1,range),e=EMO[rnd(0,EMO.length-1)];return{s:'Đếm xem có bao nhiêu?',em:e.repeat(n),t:'',a:n,o:opts3(n,range+3),say:'Đếm xem có bao nhiêu'}}
    const n=rnd(0,range-1);return{s:'Số liền sau của',em:'',t:n+' là?',a:n+1,o:opts3(n+1,range),say:'Số liền sau của '+n+' là số nào?'}
  }
  if(topic==='cmp'){
    const a=rnd(1,range);let b=Math.random()<.15?a:rnd(1,range);
    return{s:'Chọn dấu thích hợp',em:'',t:`${a} ? ${b}`,a:a>b?'>':a<b?'<':'=',o:['>','<','='],say:`${a} so với ${b}, chọn dấu thích hợp`}
  }
  if(topic==='add'){const a=rnd(1,range-1),b=rnd(1,range-a);return{s:'Tính kết quả',em:'',t:`${a} + ${b} = ?`,a:a+b,o:opts3(a+b,range),say:`${a} cộng ${b} bằng mấy?`}}
  const a=rnd(2,range),b=rnd(1,a);return{s:'Tính kết quả',em:'',t:`${a} − ${b} = ?`,a:a-b,o:opts3(a-b,range),say:`${a} trừ ${b} bằng mấy?`}
}

/* ---------- Minigame ---------- */
const SKY='linear-gradient(#7cc8ff,#c9ecff 62%,#c8ee9a 62%)',NIGHT='linear-gradient(#1c2a6b,#6a45b0)',SEA='linear-gradient(#bfe9ff,#4aa8e8 40%,#2f7fd0)',ROAD='linear-gradient(#9fdcff 62%,#8a8f9c 62%)',WOOD='linear-gradient(#a8e08a 62%,#7cc15f 62%)',ROOM='linear-gradient(#ffe9c7,#ffc98a)';
const TH=[
{n:'Cây nở hoa',k:'tree',bg:SKY},
{n:'Vườn hướng dương',k:'slots',a:'🌻',bg:SKY},
{n:'Hái sao đầy trời',k:'slots',a:'⭐',bg:NIGHT},
{n:'Hái nấm rừng',k:'slots',a:'🍄',bg:WOOD},
{n:'Bắt bướm',k:'slots',a:'🦋',bg:SKY},
{n:'Hái táo',k:'slots',a:'🍎',bg:WOOD},
{n:'Tưới cây lớn lên',k:'evolve',st:['🌱','🌿','🌷','🌻'],f:'💧',bg:SKY},
{n:'Ấp trứng nở gà',k:'evolve',st:['🥚','🥚','🐣','🐥','🐔'],f:'❤️',bg:ROOM},
{n:'Cho gà ăn',k:'evolve',st:['🐣','🐥','🐤','🐓'],f:'🌾',bg:WOOD},
{n:'Xây lâu đài',k:'evolve',st:['⛺','🏠','🏡','🏰'],f:'🧱',bg:SKY},
{n:'Cho rồng con ăn',k:'evolve',st:['🥚','🐲','🐉'],f:'🍖',bg:NIGHT},
{n:'Đua xe',k:'race',m:'🏎️',flip:1,fin:'🏁',bg:ROAD},
{n:'Tên lửa lên Mặt Trăng',k:'race',m:'🚀',fin:'🌕',bg:NIGHT},
{n:'Tàu hỏa',k:'race',m:'🚂',flip:1,fin:'🚉',bg:ROAD},
{n:'Thuyền buồm',k:'race',m:'⛵',fin:'🏝️',bg:SEA},
{n:'Bắn bóng bay',k:'shoot',t:'🎈',s:'🧒',p:'🏹',bg:SKY},
{n:'Đập chuột',k:'shoot',t:'🐹',s:'🔨',p:'🔨',bg:WOOD},
{n:'Câu cá',k:'shoot',t:'🐟',s:'🎣',p:'🪝',bg:SEA},
{n:'Bóng rổ',k:'shoot',t:'🥅',s:'⛹️',p:'🏀',keep:'⭐',bg:ROOM},
{n:'Ném bowling',k:'shoot',t:'🎳',s:'🧑',p:'⚽',bg:ROOM},
{n:'Phi thuyền diệt quái vật',k:'shoot',t:'👾',s:'🚀',p:'✨',bg:NIGHT}
];
const SPOTS=[[150,50],[100,80],[200,80],[70,125],[130,110],[170,110],[230,125],[105,160],[195,160],[150,145]];
let T,sc,U,els=[],ev,mv,shooter,lastTh=-1;
function put(h,x,y,fs,cls){const d=document.createElement('div');d.className='a '+(cls||'');d.innerHTML=h;d.style.cssText=`left:${x}%;top:${y}%;font-size:${fs*U}px`;sc.appendChild(d);return d}
function shk(e){e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),400)}
const tp=i=>[14+(i%5)*18,20+Math.floor(i/5)*22];
function setup(k){
  if(k==null)do{k=rnd(0,TH.length-1)}while(k===lastTh);lastTh=k;T=TH[k];
  sc=$('scene');sc.innerHTML='';sc.style.background=T.bg;U=Math.min(sc.clientWidth,sc.clientHeight)/10;els=[];
  sc.insertAdjacentHTML('beforeend',`<div class="lbl">🎮 ${T.n}</div>`);
  if(T.k==='tree'){
    sc.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMax meet" style="position:absolute;inset:50px 0 0;width:100%;height:calc(100% - 50px)"><g id="treeG" style="transform-origin:150px 290px;transition:transform .5s;transform:scale(.8)"><path d="M138 290 Q142 220 134 175 L166 175 Q158 220 162 290Z" fill="#a66a3c"/><circle cx="150" cy="120" r="88" fill="#4cae5c"/><circle cx="92" cy="150" r="52" fill="#58bd67"/><circle cx="208" cy="150" r="52" fill="#58bd67"/><circle cx="150" cy="80" r="56" fill="#63c972"/><g id="slots">${SPOTS.map((p,i)=>`<circle id="b${i}" cx="${p[0]}" cy="${p[1]}" r="13" fill="#ffffff88"/>`).join('')}</g></g></svg>`);
  }else if(T.k==='slots'){
    for(let i=0;i<10;i++)els.push(put('⚪',16+(i%5)*17,44+Math.floor(i/5)*20,3.6,'dim'));
  }else if(T.k==='evolve'){
    ev=put(T.st[0],50,60,4.5);
  }else if(T.k==='race'){
    put(T.fin,91,62,3.6);mv=put(`<span style="display:inline-block;${T.flip?'transform:scaleX(-1)':''}">${T.m}</span>`,8,62,3.6);
  }else{
    for(let i=0;i<10;i++){const p=tp(i);els.push(put(T.t,p[0],p[1],3.4))}
    shooter=put(T.s,50,86,3.8);
  }
}
function target(i){return T.k==='tree'?$('b'+i):T.k==='evolve'?ev:T.k==='race'?mv:els[i]}
function hit(ok,q,i){
  if(i==null)i=idx;
  if(T.k==='tree'){
    if(!ok)return;const p=SPOTS[i];$('b'+i).remove();
    $('slots').insertAdjacentHTML('beforeend',`<text x="${p[0]}" y="${p[1]+10}" text-anchor="middle" font-size="30">🌸</text><text x="${p[0]}" y="${p[1]+7}" text-anchor="middle" font-size="13">⭐</text>`);
    $('treeG').style.transform=`scale(${.8+score*.02})`;
  }else if(T.k==='slots'){
    if(ok){els[i].innerHTML=T.a;els[i].classList.remove('dim');if(!q)els[i].classList.add('pop')}else if(!q)shk(els[i]);
  }else if(T.k==='evolve'){
    const up=()=>{ev.innerHTML=T.st[Math.min(T.st.length-1,Math.floor(score/10*T.st.length))];ev.style.fontSize=(4.5+score*.28)*U+'px'};
    if(q){if(ok)up();return}
    const f=put(T.f,50,8,2.4);requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.top='52%';if(!ok)f.style.left='18%'}));
    setTimeout(()=>{f.remove();if(ok){up();ev.classList.remove('hop');void ev.offsetWidth;ev.classList.add('hop')}else shk(ev)},600);
  }else if(T.k==='race'){
    if(ok)mv.style.left=(8+score*7.4)+'%';else if(!q)shk(mv);
  }else{
    if(q){if(ok){els[i].innerHTML=T.keep||'💥';if(!T.keep)els[i].style.opacity=0}return}
    const p=put(T.p,50,86,2.4),t=tp(i);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{if(ok){p.style.left=t[0]+'%';p.style.top=t[1]+'%'}else{p.style.left=rnd(10,90)+'%';p.style.top='-8%';p.style.opacity=0}}));
    setTimeout(()=>{p.remove();
      if(ok){els[i].innerHTML=T.keep||'💥';els[i].classList.add('pop');if(!T.keep)setTimeout(()=>els[i].style.opacity=0,450)}else shk(shooter)},650);
  }
}
function tapStep(el,cb){
  let done=0,tm;const go=()=>{if(done)return;done=1;clearTimeout(tm);el.classList.remove('glow');el.onclick=null;cb()};
  el.classList.add('glow');el.onclick=go;el.style.cursor='pointer';tm=setTimeout(go,8000);
}

/* ---------- Luồng chơi ---------- */
function start(){
  qs=[];const seen=new Set();let g=0;while(qs.length<10){const q=makeQ(),key=q.t+'|'+q.a;if(!seen.has(key)||g++>80){seen.add(key);qs.push(q)}}
  idx=0;score=0;res=[];locked=false;
  show('play');setup();$('sc').textContent=0;$('pg').style.width='0';
  S.game={topic,range,qs,idx:0,score:0,res,th:lastTh};save();startMusic();render();
}
function resume(){
  const g=S.game;if(!g)return;
  topic=g.topic;range=g.range;qs=g.qs;res=g.res;locked=false;
  show('play');setup(g.th);$('sc').textContent=g.score;
  let c=0;for(let j=0;j<g.idx;j++)if(res[j]){c++;score=c;hit(true,1,j)}
  score=g.score;idx=g.idx;$('pg').style.width=(idx*10)+'%';startMusic();
  idx>=10?finish():render();
}
function render(){
  const q=qs[idx];locked=false;
  $('qs').textContent=q.s;$('qem').textContent=q.em;$('qt').textContent=q.t;
  $('opts').innerHTML=q.o.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('');
  speak(q.say);
}
function toast(t,bad){const e=$('toast');e.textContent=t;e.className='show'+(bad?' bad':'');setTimeout(()=>e.className='',1000)}
$('opts').onclick=e=>{
  const b=e.target.closest('.opt');if(!b||locked)return;locked=true;
  const i=idx,q=qs[i],ok=b.dataset.v==String(q.a);
  if(ok){b.classList.add('ok');score++;$('sc').textContent=score;toast('Tuyệt vời! ⭐ +1');beep(true)}
  else{b.classList.add('no');[...$('opts').children].find(x=>x.dataset.v==String(q.a)).classList.add('ok');toast('Chưa đúng, đáp án: '+q.a,true);beep(false)}
  res[i]=ok;idx=i+1;S.game.idx=idx;S.game.score=score;save();
  $('pg').style.width=(idx*10)+'%';
  const next=()=>setTimeout(()=>{idx<10?render():finish()},1100);
  if(!ok){hit(false,0,i);next();return}
  setTimeout(()=>toast('👆 Chạm vào vật đang sáng!'),1100);
  tapStep(target(i),()=>{hit(true,0,i);next()});
};
function finish(){
  const st=score>=9?3:score>=6?2:score>=3?1:0;
  S.stars+=score;const k=topic+'-'+range,o=S.stats[k]||{plays:0,best:0};o.plays++;o.best=Math.max(o.best,score);S.stats[k]=o;S.game=null;save();
  $('rt').textContent=score>=9?'Giỏi quá!':score>=6?'Khá lắm!':'Cố gắng lên nhé!';
  $('rs').textContent=`Đúng ${score}/10 câu`;
  $('rst').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);
  $('rn').textContent=TOPICS.find(t=>t.id===topic).n+' · Phạm vi '+range;
  $('rg').textContent=score;show('done');
}
$('start').onclick=start;$('again').onclick=start;$('resume').onclick=resume;
$('home2').onclick=()=>{buildHome();show('home')};
$('quit').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}buildHome();show('home')};
$('spk').onclick=()=>speak(qs[idx]?qs[idx].say:'');

/* ---------- Giọng đọc ---------- */
function speak(t){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=.9;speechSynthesis.speak(u)}catch(e){}
}

/* ---------- Âm thanh & nhạc nền (tự tạo bằng WebAudio, không cần file) ---------- */
let ac,musicOn=true,timer=null,step=0;
const N={C4:262,D4:294,E4:330,G4:392,A4:440,C5:523,D5:587,E5:659,G5:784,C3:131,F3:175,G3:196,A3:220};
const MEL=['E4','G4','C5','G4','E4','G4','A4',0,'D4','G4','A4','G4','E4','D4','C4',0,'E4','G4','C5','E5','D5','C5','A4',0,'G4','E4','D4','E4','C4',0,0,0];
const BASS=['C3','C3','F3','F3','C3','C3','G3','G3'];
function tone(f,t,d,type,v){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05);
}
function tick(){
  if(!ac||ac.state!=='running')return;const t=ac.currentTime+.05,m=MEL[step%MEL.length];
  if(m)tone(N[m],t,.4,'triangle',.07);
  if(step%4===0)tone(N[BASS[(step/4)%BASS.length]],t,.9,'sine',.06);
  step++;
}
function startMusic(){
  if(!musicOn)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();}catch(e){return}
  if(!timer)timer=setInterval(tick,340);
}
function stopMusic(){clearInterval(timer);timer=null}
function beep(ok){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();const t=ac.currentTime;
    if(ok){tone(660,t,.15,'sine',.15);tone(880,t+.12,.25,'sine',.15)}else tone(220,t,.3,'sawtooth',.06)}catch(e){}
}
$('musicBtn').onclick=()=>{
  musicOn=!musicOn;$('musicBtn').textContent='🎵 Nhạc: '+(musicOn?'Bật':'Tắt');
  musicOn?startMusic():stopMusic();
};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMusic();else if(musicOn&&$('play').classList.contains('on'))startMusic()});


buildHome();
</script>
