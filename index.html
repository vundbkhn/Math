<style>
:root{--bg:#eaf1ff;--ink:#1e2a52;--blue:#2f6fe4;--card:#fff;--soft:#f3f6ff;--line:#d5e0fa;--green:#5fd68a;--red:#ff8f8f;--org:#ff8a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg) radial-gradient(#cfdcf7 1.5px,transparent 1.5px) 0 0/26px 26px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
.screen{display:none;min-height:100%;padding:18px;max-width:1100px;margin:auto}
.screen.on{display:block}
h1{margin:6px 0 2px;font-size:clamp(26px,5vw,40px);text-align:center}
h2{font-size:20px;margin:22px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:0 3px 10px #2f6fe422;border:0;color:var(--ink);font-size:17px;cursor:pointer;font-family:inherit}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--card);border-radius:26px;padding:14px;box-shadow:0 6px 18px #2f6fe426;border:4px solid transparent;cursor:pointer;text-align:center;font-weight:800;font-size:19px;transition:.15s;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.card:active{transform:scale(.96)}
.card.sel{border-color:var(--blue);background:#f4f8ff}
.card .ic{width:100%;height:96px;background:var(--soft);border-radius:20px;padding:8px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .ic svg{width:80px;height:80px;overflow:visible;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.card:hover .ic svg,.card.sel .ic svg{transform:scale(1.08) translateY(-2px)}
.ranges{display:flex;gap:10px;flex-wrap:wrap}
.ranges .pill{flex:1;min-width:120px;border:4px solid transparent}
.ranges .pill.sel{border-color:var(--blue);background:#f4f8ff}
.big{display:block;width:100%;margin-top:22px;padding:16px;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(#3b7cf0,#2259cf);border:0;border-radius:999px;box-shadow:0 6px 0 #1a46a6;cursor:pointer;font-family:inherit}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #1a46a6}
.big.alt{background:#fff;color:var(--ink);box-shadow:0 4px 12px #2f6fe426;margin-top:12px;font-size:18px}
/* game */
.game{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:calc(100vh - 36px)}
.left{background:linear-gradient(#7cc8ff,#c9ecff 60%,#c8ee9a 60%);border-radius:30px;position:relative;overflow:hidden;min-height:320px;box-shadow:0 6px 18px #2f6fe426}
.bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:2}
.prog{flex:1;height:16px;background:#eaf1ff;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#4a7de8;border-radius:99px;transition:.4s}
#scene{position:absolute;inset:0;overflow:hidden}
.lbl{position:absolute;bottom:10px;right:12px;background:#ffffffd9;border-radius:99px;padding:4px 12px;font-weight:800;font-size:13px;z-index:2;box-shadow:0 2px 6px #00000018}
#toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:99px;font-weight:900;color:#fff;background:#2fb766;box-shadow:0 0 14px #2fb76699;opacity:0;transition:.25s;white-space:nowrap;z-index:3}
#toast.show{opacity:1}#toast.bad{background:#e35d5d;box-shadow:none}
.right{background:#fff;border-radius:30px;padding:16px;box-shadow:0 6px 18px #2f6fe426}
.q{border:2px solid var(--line);border-radius:26px;padding:22px 12px;text-align:center;position:relative;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.q .t{font-size:clamp(32px,5.5vw,50px);font-weight:900;color:#3a63c8}
.q .s{font-size:18px;font-weight:800;color:#6a7aa8}
.q .em{font-size:clamp(28px,4.5vw,40px);line-height:1.25;word-break:break-all;width:100%}
.spk{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;border:0;background:var(--soft);font-size:20px;cursor:pointer}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.opt{padding:22px 4px;font-size:clamp(26px,4.5vw,40px);font-weight:900;background:var(--soft);border:2px solid var(--line);border-radius:22px;cursor:pointer;color:var(--ink);font-family:inherit}
.opt:active{transform:scale(.96)}
.opt.ok{background:var(--green);color:#fff;border-color:var(--green)}
.opt.no{background:var(--red);color:#fff;border-color:var(--red)}
.res{text-align:center}
.res .face{font-size:110px}
.res .st{font-size:70px;letter-spacing:6px;margin:8px 0}
.res .gain{background:#fff3d6;border-radius:24px;padding:16px;font-weight:900;font-size:22px;color:#a0481a;margin-top:12px}
@media(max-width:760px){.game{grid-template-columns:1fr}.left{min-height:320px}}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.card small{display:block;font-size:13px;color:#6a7aa8;font-weight:700;margin-top:2px}
/* Sơ đồ tách gộp */
.bond{display:inline-flex;flex-direction:column;align-items:center;gap:4px;margin:2px auto}
.bond .top{width:64px;height:64px;border-radius:50%;background:#eef4ff;border:4px solid #3a63c8;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#2248a8;box-shadow:0 4px 10px #3a63c822}
.bond .legs{width:130px;height:28px}
.bond .row{display:flex;gap:34px}
.bond .bot{width:60px;height:60px;border-radius:50%;background:#fff6e5;border:4px solid #ff9a3d;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#b84c14;box-shadow:0 4px 10px #ff9a3d22}
.bond .unk{background:#fff0f0;border-style:dashed;border-color:#e84c4c;color:#e84c4c;animation:pulseQ 1.2s infinite alternate}
@keyframes pulseQ{from{transform:scale(1)}to{transform:scale(1.07)}}

/* ===== Minigame SVG ===== */
.sv{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fb{transform-box:fill-box}
.hitg{opacity:0;cursor:pointer}
.hitg.glow{animation:halo .55s infinite alternate;filter:none}
@keyframes halo{from{opacity:.2}to{opacity:1}}
.rays{transform-box:fill-box;transform-origin:50% 50%;animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.bobg{animation:bobr 2.6s ease-in-out infinite}
@keyframes bobr{50%{transform:translateY(-5px)}}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
.arm{transform-box:fill-box;transform-origin:50% 10%;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s ease-out}
@keyframes grow{0%{transform:scale(.9,.8)}50%{transform:scale(1.06,1.1)}100%{transform:scale(1)}}
.crt{opacity:0;transition:opacity .9s}
.crt.in{opacity:1}
.fly{animation:fly 6s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0)}25%{transform:translate(16px,-12px)}50%{transform:translate(2px,-22px)}75%{transform:translate(-16px,-8px)}}
.fly2{animation:fly2 3.2s ease-in-out infinite}
@keyframes fly2{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-10px,-8px) rotate(-6deg)}50%{transform:translate(-4px,-14px)}75%{transform:translate(8px,-6px) rotate(6deg)}}
.flap{transform-box:fill-box;transform-origin:50% 50%;animation:flap .45s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.4)}}
.flapv{transform-box:fill-box;transform-origin:50% 100%;animation:flapv .1s linear infinite alternate}
@keyframes flapv{to{transform:scaleY(.5)}}
.wob{transform-box:fill-box;transform-origin:50% 60%;animation:wob .5s}
@keyframes wob{20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-5deg)}}
.drip{animation:drip .55s ease-in both}
@keyframes drip{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(76px);opacity:.15}}
.spk2{animation:spark .9s ease-out both}
@keyframes spark{0%{transform:translate(0,0) scale(0);opacity:0}25%{opacity:1;transform:translate(calc(var(--dx)*.4),calc(var(--dy)*.4)) scale(1.15)}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.pop2{transform-box:fill-box;transform-origin:50% 50%;animation:pop2 .55s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop2{from{transform:scale(0)}to{transform:scale(1)}}
.cap{font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-weight:900;fill:#fff;stroke:#2a4aa8;stroke-width:5px;paint-order:stroke;stroke-linejoin:round;transform-box:fill-box;transform-origin:50% 50%;animation:capup 1.5s both}
@keyframes capup{0%{opacity:0;transform:translateY(10px) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1.12)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.tw{transform-box:fill-box;transform-origin:50% 50%;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25;transform:scale(.55)}}
.bobS{transform-box:fill-box;transform-origin:50% 50%;animation:bobs 2.2s ease-in-out infinite}
@keyframes bobs{50%{transform:translateY(-9px) rotate(4deg)}}
.meteor{animation:meteor 9s linear infinite}
@keyframes meteor{0%{transform:translate(0,0);opacity:0}3%{opacity:1}13%{transform:translate(-230px,130px);opacity:0}100%{transform:translate(-230px,130px);opacity:0}}
.flash{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:0}25%{opacity:.9}100%{opacity:0}}
.flame{transform-box:fill-box;transform-origin:50% 0%;animation:flame .16s ease-in-out infinite alternate}
@keyframes flame{from{transform:scaleY(.85) scaleX(.92)}to{transform:scaleY(1.2) scaleX(1.06)}}
.wave{animation:wave 3.4s ease-in-out infinite alternate}
@keyframes wave{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.wheel{transform-box:fill-box;transform-origin:50% 50%;animation:spin 1.1s linear infinite}
.puf{animation:puf 2.2s ease-out infinite}
@keyframes puf{0%{transform:translate(0,0) scale(.5);opacity:.8}100%{transform:translate(-28px,-36px) scale(1.6);opacity:0}}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 6px}
.fr b{display:block;padding:0 6px;font-weight:900}.fr b:first-child{border-bottom:.09em solid currentColor}
.q .t.sm{font-size:clamp(22px,4.2vw,34px)}
.opts.txt .opt{font-size:clamp(15px,2.8vw,21px);padding:18px 6px}
.opts.two{grid-template-columns:repeat(2,1fr)}
.tip{display:none;margin-top:12px;background:#fff8e1;border:2px solid #ffe08a;border-radius:18px;padding:10px 14px;font-weight:800;color:#7a4b00;font-size:16px;text-align:center}
.stkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:14px}
.sk{position:relative;background:#fff;border:0;border-radius:20px;padding:6px 4px 8px;box-shadow:0 4px 12px #2f6fe422;cursor:pointer;font-family:inherit;color:var(--ink);font-weight:800}
.sk svg{width:100%;height:auto;display:block}
.sk small{display:block;font-size:11px;margin-top:2px;color:#6a7aa8}
.sk.lock{cursor:default}.sk.lock svg{filter:brightness(0);opacity:.1}
.sk .cnt{position:absolute;top:6px;right:8px;background:#ff8a3d;color:#fff;border-radius:99px;padding:1px 7px;font-size:12px;font-style:normal;font-weight:900}
.skres{margin:22px auto 8px;text-align:center}
.skpop svg{width:min(230px,62vw);height:auto;animation:skin .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes skin{from{transform:scale(0) rotate(-12deg)}to{transform:none}}
.skcap{font-weight:900;font-size:19px;color:#a0481a;margin:6px 0}
.skres small{display:block;color:#6a7aa8;font-weight:700}
.ov{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50}.ov.on{display:flex}
.ovc{background:#fff;border-radius:30px;padding:18px;width:min(340px,86vw);text-align:center;font-weight:900}
.ovc svg{width:100%;height:auto}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <div class="top">
    <div style="display:flex;gap:8px"><button class="pill" id="musicBtn">🎵 Bật</button><button class="pill" id="stkBtn">🐱 Sticker</button></div>
    <div class="pill">⭐ <span id="total">0</span></div>
  </div>
  <h1>🤖 Bé Học Toán</h1>
  <h2>Chọn bài học</h2>
  <div class="grid g4" id="topics"></div>
  <div id="subWrap" style="display:none"><h2>Chọn bài nhỏ</h2><div class="ranges" id="subs"></div></div>
  <h2 id="rh">Chọn phạm vi</h2>
  <div class="ranges" id="ranges"></div>
  <button class="big alt" id="resume" style="display:none"></button>
  <button class="big" id="start">Bắt đầu!</button>
</section>

<!-- GAME -->
<section id="play" class="screen">
  <div class="game">
    <div class="left">
      <div class="bar">
        <button class="pill" id="quit" style="padding:8px 14px">✕</button>
        <div class="prog"><i id="pg"></i></div>
        <div class="pill" style="padding:6px 14px">⭐ <span id="sc">0</span></div>
      </div>
      <div id="toast"></div>
      <div id="scene"></div>
    </div>
    <div class="right">
      <div class="q">
        <button class="spk" id="spk" title="Đọc câu hỏi">🔊</button>
        <div class="s" id="qs"></div>
        <div class="em" id="qem"></div>
        <div class="t" id="qt"></div>
      </div>
      <div class="opts" id="opts"></div>
      <div class="tip" id="tip"></div>
    </div>
  </div>
</section>

<!-- RESULT -->
<section id="done" class="screen">
  <div class="res" style="max-width:560px;margin:auto">
    <div class="face">🤖</div>
    <h1 id="rt">Giỏi quá!</h1>
    <div id="rs" style="font-weight:700;color:#6a7aa8"></div>
    <div class="st" id="rst"></div>
    <div id="rn" style="font-weight:900;font-size:20px"></div>
    <div class="gain">⭐ +<span id="rg">0</span> sao</div>
    <button class="big" id="again">Chơi lại</button>
    <button class="big alt" id="home2">Về nhà</button>
    <div class="skres" id="skres"></div>
  </div>
</section>

<!-- STICKER -->
<section id="stk" class="screen">
  <div class="top"><button class="pill" id="stkBack">← Về</button><div class="pill">🐱 <span id="stkN">0</span>/100</div></div>
  <h1>Bộ sưu tập sticker</h1>
  <div class="stkgrid" id="stkGrid"></div>
</section>
<div class="ov" id="stkOv"><div class="ovc"></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="skOut" filterUnits="userSpaceOnUse" x="-30" y="-30" width="260" height="260" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="6" result="d"/><feFlood flood-color="#fff"/><feComposite in2="d" operator="in" result="w"/><feDropShadow in="w" dx="0" dy="3" stdDeviation="3" flood-color="#1e2a52" flood-opacity=".28" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>
<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- Hình minh hoạ SVG cho các phép toán ở trang bắt đầu ---------- */
const TOPIC_ICONS={
  count:`<svg viewBox="0 0 100 100">
    <defs><radialGradient id="icAp" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff9a8b"/><stop offset=".6" stop-color="#f23b2c"/><stop offset="1" stop-color="#b81b14"/></radialGradient></defs>
    <circle cx="50" cy="54" r="34" fill="#ffe4ea"/>
    <g transform="translate(34 44) scale(.72)">
      <path d="M0 -18C2 -27 10 -31 14 -28" stroke="#7c4722" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M2 -20C12 -28 24 -22 20 -12C14 -8 4 -14 2 -20Z" fill="#52c44a"/>
      <path d="M0 -14C-16 -22 -28 -6 -22 14C-16 28 -4 28 0 23C4 28 16 28 22 14C28 -6 16 -22 0 -14Z" fill="url(#icAp)"/>
      <ellipse cx="-10" cy="-4" rx="5" ry="3" fill="#fff" opacity=".6" transform="rotate(-30 -10 -4)"/>
    </g>
    <g transform="translate(66 44) scale(.72)">
      <path d="M0 -18C2 -27 10 -31 14 -28" stroke="#7c4722" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M2 -20C12 -28 24 -22 20 -12C14 -8 4 -14 2 -20Z" fill="#52c44a"/>
      <path d="M0 -14C-16 -22 -28 -6 -22 14C-16 28 -4 28 0 23C4 28 16 28 22 14C28 -6 16 -22 0 -14Z" fill="url(#icAp)"/>
      <ellipse cx="-10" cy="-4" rx="5" ry="3" fill="#fff" opacity=".6" transform="rotate(-30 -10 -4)"/>
    </g>
    <g transform="translate(50 70) scale(.72)">
      <path d="M0 -18C2 -27 10 -31 14 -28" stroke="#7c4722" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M2 -20C12 -28 24 -22 20 -12C14 -8 4 -14 2 -20Z" fill="#52c44a"/>
      <path d="M0 -14C-16 -22 -28 -6 -22 14C-16 28 -4 28 0 23C4 28 16 28 22 14C28 -6 16 -22 0 -14Z" fill="url(#icAp)"/>
      <ellipse cx="-10" cy="-4" rx="5" ry="3" fill="#fff" opacity=".6" transform="rotate(-30 -10 -4)"/>
    </g>
    <circle cx="80" cy="78" r="14" fill="#ffb82e" stroke="#fff" stroke-width="2.5"/>
    <text x="80" y="84" text-anchor="middle" font-size="17" font-weight="900" fill="#fff" font-family="Nunito,sans-serif">3</text>
  </svg>`,
  cmp:`<svg viewBox="0 0 100 100">
    <circle cx="50" cy="52" r="36" fill="#fff3d6"/>
    <path d="M34 86L66 86L58 76L42 76Z" fill="#d9822b"/>
    <rect x="46" y="28" width="8" height="50" rx="4" fill="#f5a623"/>
    <circle cx="50" cy="26" r="7" fill="#ff7043"/>
    <g transform="rotate(-11 50 32)">
      <rect x="14" y="29" width="72" height="6" rx="3" fill="#e69119"/>
      <path d="M22 35L14 54M22 35L30 54" stroke="#8a5a2b" stroke-width="2"/>
      <path d="M10 54Q22 64 34 54Z" fill="#4f9bf2"/>
      <circle cx="22" cy="48" r="7" fill="#ff5b4d"/>
      <path d="M78 35L70 54M78 35L86 54" stroke="#8a5a2b" stroke-width="2"/>
      <path d="M66 54Q78 64 90 54Z" fill="#4f9bf2"/>
      <circle cx="78" cy="49" r="5" fill="#52c44a"/>
    </g>
    <rect x="37" y="54" width="26" height="22" rx="8" fill="#3a63c8" stroke="#fff" stroke-width="2.5"/>
    <text x="50" y="70" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" font-family="Nunito,sans-serif">&gt;</text>
  </svg>`,
  add:`<svg viewBox="0 0 100 100">
    <defs><linearGradient id="icAdd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee787"/><stop offset="1" stop-color="#28a745"/></linearGradient></defs>
    <circle cx="50" cy="52" r="36" fill="#e3fcec"/>
    <path d="M40 20H60V40H80V60H60V80H40V60H20V40H40Z" fill="url(#icAdd)" stroke="#1e8235" stroke-width="3" stroke-linejoin="round"/>
    <path d="M43 24H57V30H43Z" fill="#fff" opacity=".4" rx="3"/>
    <circle cx="22" cy="24" r="4" fill="#ffcb2b"/>
    <circle cx="80" cy="22" r="5" fill="#ff789e"/>
    <circle cx="78" cy="78" r="4.5" fill="#4aa8ff"/>
  </svg>`,
  sub:`<svg viewBox="0 0 100 100">
    <defs><linearGradient id="icSub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8d7a"/><stop offset="1" stop-color="#e63b2e"/></linearGradient></defs>
    <circle cx="50" cy="52" r="36" fill="#ffe8e5"/>
    <rect x="18" y="40" width="64" height="22" rx="11" fill="url(#icSub)" stroke="#b82218" stroke-width="3"/>
    <rect x="24" y="44" width="52" height="6" rx="3" fill="#fff" opacity=".4"/>
    <circle cx="25" cy="26" r="4.5" fill="#ffcb2b"/>
    <circle cx="76" cy="74" r="5" fill="#52c44a"/>
    <path d="M74 22L76 27L81 29L76 31L74 36L72 31L67 29L72 27Z" fill="#ff9f14"/>
  </svg>`,
  bond:`<svg viewBox="0 0 100 100">
    <circle cx="50" cy="52" r="36" fill="#eef4ff"/>
    <path d="M50 30L28 66M50 30L72 66" stroke="#7c98e0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="50" cy="26" r="16" fill="#3a63c8" stroke="#fff" stroke-width="2.5"/>
    <text x="50" y="32" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" font-family="Nunito,sans-serif">5</text>
    <circle cx="26" cy="70" r="14" fill="#ff9a3d" stroke="#fff" stroke-width="2.5"/>
    <text x="26" y="75" text-anchor="middle" font-size="15" font-weight="900" fill="#fff" font-family="Nunito,sans-serif">2</text>
    <circle cx="74" cy="70" r="14" fill="#52c44a" stroke="#fff" stroke-width="2.5"/>
    <text x="74" y="75" text-anchor="middle" font-size="15" font-weight="900" fill="#fff" font-family="Nunito,sans-serif">3</text>
  </svg>`,
  seq:`<svg viewBox="0 0 100 100">
    <circle cx="50" cy="52" r="36" fill="#f4ecff"/>
    <rect x="10" y="38" width="24" height="28" rx="8" fill="#5b97ff" stroke="#fff" stroke-width="2"/>
    <text x="22" y="58" text-anchor="middle" font-size="15" font-weight="900" fill="#fff" font-family="Nunito,sans-serif">4</text>
    <rect x="38" y="34" width="24" height="32" rx="8" fill="#ff9f14" stroke="#fff" stroke-width="2.5"/>
    <text x="50" y="56" text-anchor="middle" font-size="17" font-weight="900" fill="#fff" font-family="Nunito,sans-serif">?</text>
    <rect x="66" y="38" width="24" height="28" rx="8" fill="#52c44a" stroke="#fff" stroke-width="2"/>
    <text x="78" y="58" text-anchor="middle" font-size="15" font-weight="900" fill="#fff" font-family="Nunito,sans-serif">6</text>
    <path d="M32 26Q50 15 68 26" stroke="#9b5de5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M64 21L70 27L62 29" stroke="#9b5de5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`
};

Object.assign(TOPIC_ICONS,{
  mul:`<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="36" fill="#fff0dc"/><path d="M32 34L68 70M68 34L32 70" stroke="#ff8a1f" stroke-width="15" stroke-linecap="round"/><path d="M32 34L68 70M68 34L32 70" stroke="#ffc266" stroke-width="5" stroke-linecap="round"/><circle cx="24" cy="78" r="5" fill="#4aa8ff"/><circle cx="78" cy="24" r="4.5" fill="#ff789e"/></svg>`,
  div:`<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="36" fill="#e3f7f4"/><circle cx="50" cy="29" r="9" fill="#17b890"/><circle cx="50" cy="75" r="9" fill="#17b890"/><rect x="22" y="46" width="56" height="12" rx="6" fill="#17b890"/><rect x="28" y="49" width="40" height="3.5" rx="2" fill="#fff" opacity=".45"/></svg>`,
  frac:`<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="36" fill="#fff3d6"/><path d="M48 50L48 20A30 30 0 0 0 18 50Z" fill="#ff9f14" stroke="#fff" stroke-width="2"/><path d="M48 54L48 84A30 30 0 0 1 18 54Z" fill="#ff9f14" stroke="#fff" stroke-width="2"/><path d="M52 50L52 20A30 30 0 0 1 82 50Z" fill="#ff9f14" stroke="#fff" stroke-width="2"/><path d="M52 54L52 84A30 30 0 0 0 82 54Z" fill="#fff" stroke="#e0a030" stroke-width="2"/><circle cx="80" cy="80" r="14" fill="#3a63c8" stroke="#fff" stroke-width="2.5"/><text x="80" y="85" text-anchor="middle" font-size="13" font-weight="900" fill="#fff" font-family="Nunito,sans-serif">3/4</text></svg>`,
  divis:`<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="36" fill="#efe9ff"/><rect x="24" y="32" width="42" height="46" rx="12" fill="#7b5cf0" stroke="#fff" stroke-width="2.5"/><text x="45" y="65" text-anchor="middle" font-size="32" font-weight="900" fill="#fff" font-family="Nunito,sans-serif">9</text><circle cx="70" cy="34" r="14" fill="#40c057" stroke="#fff" stroke-width="2.5"/><path d="M63 34L68 39L77 28" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  avg:`<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="36" fill="#e6f4ff"/><rect x="22" y="58" width="16" height="22" rx="4" fill="#4aa8ff"/><rect x="42" y="34" width="16" height="46" rx="4" fill="#ff9f14"/><rect x="62" y="46" width="16" height="34" rx="4" fill="#52c44a"/><path d="M16 54L84 54" stroke="#e84c4c" stroke-width="3.5" stroke-dasharray="6 5" stroke-linecap="round"/></svg>`,
  geo:`<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="36" fill="#fff5d6"/><path d="M42 21.5L22 76L80 76" fill="none" stroke="#3a63c8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 76L42 76A20 20 0 0 0 28.8 57.2Z" fill="#ffd8a8" stroke="#ff7b00" stroke-width="2"/><path d="M72 34L86 48L72 62L58 48Z" fill="#ffb347" stroke="#e8890c" stroke-width="3" stroke-linejoin="round"/></svg>`
});
const TOPICS=[
  {id:'count',n:'Tập đếm',i:TOPIC_ICONS.count},
  {id:'cmp',n:'So sánh',i:TOPIC_ICONS.cmp},
  {id:'add',n:'Phép cộng',i:TOPIC_ICONS.add},
  {id:'sub',n:'Phép trừ',i:TOPIC_ICONS.sub},
  {id:'bond',n:'Tách gộp',i:TOPIC_ICONS.bond},
  {id:'seq',n:'Liền trước - sau',i:TOPIC_ICONS.seq},
  {id:'mul',n:'Phép nhân',i:TOPIC_ICONS.mul},
  {id:'div',n:'Phép chia',i:TOPIC_ICONS.div},
  {id:'frac',n:'Phân số',i:TOPIC_ICONS.frac},
  {id:'divis',n:'Chia hết',i:TOPIC_ICONS.divis},
  {id:'avg',n:'Trung bình cộng',i:TOPIC_ICONS.avg},
  {id:'geo',n:'Hình học',i:TOPIC_ICONS.geo}
];
const RANGES=[10,20,100,1000];
let topic='count',range=10,qs=[],idx=0,score=0,locked=false;
const SAVE='beHocToan.v2';
let S={stars:0,topic:'count',range:10,stats:{},game:null};
try{const o=JSON.parse(localStorage.getItem(SAVE))||JSON.parse(localStorage.getItem('beHocToan.v1'));if(o)Object.assign(S,o);else{const old=+localStorage.getItem('mathStars');if(old)S.stars=old}}catch(e){}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
if(!TOPICS.some(t=>t.id===S.topic))S.topic='count';
if(!S.sub)S.sub={};
if(!S.stk)S.stk={};
topic=S.topic;range=S.range;let res=[];

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function buildHome(){
  $('total').textContent=S.stars;
  $('topics').innerHTML=TOPICS.map(t=>{const o=S.stats[t.id+'-'+range];return `<button class="card ${t.id===topic?'sel':''}" data-t="${t.id}"><div class="ic">${t.i}</div>${t.n}<small>${o?`Cao nhất ${o.best}/10 · ${o.plays} lượt`:'Chưa học'}</small></button>`}).join('');
  const nw=NEWT.includes(topic);$('rh').textContent=nw?'Chọn mức độ':'Chọn phạm vi';
  $('ranges').innerHTML=RANGES.map((r,i)=>`<button class="pill ${r===range?'sel':''}" data-r="${r}">${nw?LVL[i]:'Phạm vi '+r}</button>`).join('');
  const sd=SUBS[topic],sw=$('subWrap');
  if(sd){sw.style.display='block';const cur=S.sub[topic]||'all';$('subs').innerHTML=[['all','Tất cả']].concat(sd).map(x=>`<button class="pill ${x[0]===cur?'sel':''}" data-s="${x[0]}">${x[1]}</button>`).join('')}else sw.style.display='none';
  const g=S.game,rb=$('resume'),tp=g&&TOPICS.find(t=>t.id===g.topic);
  if(g&&tp&&g.idx<10){rb.style.display='block';rb.textContent=`▶ Học tiếp: ${tp.n} · phạm vi ${g.range} (câu ${g.idx+1}/10)`}else rb.style.display='none';
}
$('topics').onclick=e=>{const b=e.target.closest('[data-t]');if(b){topic=S.topic=b.dataset.t;save();buildHome()}};
$('ranges').onclick=e=>{const b=e.target.closest('[data-r]');if(b){range=S.range=+b.dataset.r;save();buildHome()}};

/* ---------- Câu hỏi ---------- */
const EMO=['🍎','🐟','⭐','🐥','🌸','🚗','🎈','🍓'];
function opts3(c,max){
  const step=max>=100?(max>=1000?rnd(1,3)*10:rnd(1,3)):1,s=new Set([c]);let g=0;
  while(s.size<3&&g++<50){const d=(rnd(1,3))*(Math.random()<.5?1:step||1)*(Math.random()<.5?-1:1);const v=c+d;if(v>=0&&v<=max)s.add(v)}
  let k=0;while(s.size<3)s.add(c+(++k));
  return shuffle([...s]);
}
function bondHTML(top,left,right){
  const cell=(v,cls)=>v==='?'?`<div class="${cls} unk">?</div>`:`<div class="${cls}">${v}</div>`;
  return `<div class="bond">${cell(top,'top')}<svg class="legs" viewBox="0 0 130 28"><path d="M52 2L28 26M78 2L102 26" stroke="#7c98e0" stroke-width="5" stroke-linecap="round"/></svg><div class="row">${cell(left,'bot')}${cell(right,'bot')}</div></div>`;
}
function makeQ(){
  if(topic==='count'){
    if(range<=20){const n=rnd(1,range),e=EMO[rnd(0,EMO.length-1)];return{s:'Đếm xem có bao nhiêu?',em:e.repeat(n),t:'',a:n,o:opts3(n,range+3),say:'Đếm xem có bao nhiêu'}}
    const n=rnd(0,range-1);return{s:'Số liền sau của',em:'',t:n+' là?',a:n+1,o:opts3(n+1,range),say:'Số liền sau của '+n+' là số nào?'}
  }
  if(topic==='cmp'){
    const a=rnd(1,range);let b=Math.random()<.15?a:rnd(1,range);
    return{s:'Chọn dấu thích hợp',em:'',t:`${a} ? ${b}`,a:a>b?'>':a<b?'<':'=',o:['>','<','='],say:`${a} so với ${b}, chọn dấu thích hợp`}
  }
  if(topic==='add'){const a=rnd(1,range-1),b=rnd(1,range-a);return{s:'Tính kết quả',em:'',t:`${a} + ${b} = ?`,a:a+b,o:opts3(a+b,range),say:`${a} cộng ${b} bằng mấy?`}}
  if(topic==='sub'){const a=rnd(2,range),b=rnd(1,a);return{s:'Tính kết quả',em:'',t:`${a} − ${b} = ?`,a:a-b,o:opts3(a-b,range),say:`${a} trừ ${b} bằng mấy?`}}
  if(topic==='bond'){
    const tot=rnd(2,range),p1=rnd(1,tot-1),p2=tot-p1,mode=rnd(0,2);
    if(mode===0)return{s:'Gộp số thích hợp',em:bondHTML('?',p1,p2),t:'',a:tot,o:opts3(tot,range+2),say:`Gộp ${p1} và ${p2} được mấy?`};
    if(mode===1)return{s:'Tách số thích hợp',em:bondHTML(tot,'?',p2),t:'',a:p1,o:opts3(p1,range),say:`${tot} gồm mấy và ${p2}?`};
    return{s:'Tách số thích hợp',em:bondHTML(tot,p1,'?'),t:'',a:p2,o:opts3(p2,range),say:`${tot} gồm ${p1} và mấy?`};
  }
  if(NEWQ[topic])return NEWQ[topic]();
  /* Điền số liền trước, liền sau, ở giữa */
  const mode=rnd(0,2);
  if(mode===0){
    const n=rnd(1,range);
    return{s:'Điền số liền trước',em:'',t:`? , ${n}`,a:n-1,o:opts3(n-1,range),say:`Số liền trước của ${n} là số nào?`};
  }
  if(mode===1){
    const n=rnd(0,range-1);
    return{s:'Điền số liền sau',em:'',t:`${n} , ?`,a:n+1,o:opts3(n+1,range),say:`Số liền sau của ${n} là số nào?`};
  }
  const mid=rnd(1,range-1);
  return{s:'Điền số ở giữa',em:'',t:`${mid-1} , ? , ${mid+1}`,a:mid,o:opts3(mid,range),say:`Số ở giữa ${mid-1} và ${mid+1} là số nào?`};
}

function mix(c,wr,ds){
  const s=new Set([c]);wr.forEach(x=>{if(x>0&&s.size<3)s.add(x)});
  let g=0;while(s.size<3&&g++<60){const v=c+pick(ds)*(Math.random()<.5?1:-1);if(v>0)s.add(v)}
  let k=1;while(s.size<3)s.add(c+k++);
  return shuffle([...s]);
}

  if(n>=7&&n<=9){FP.slice(0,n===7?3:n===8?5:2).forEach(([dx,t])=>{const x=bx+dx,y=f1(by-H*t-6);s+=n===7?`<circle cx="${x}" cy="${y}" r="3.8" fill="#ffe14d" stroke="#f0b400" stroke-width="1"/>`:flowerSVG(x,y,n===8?1:.8)})}

function jHit(ok,q){

  const k=score-1,p=slotPos(k);w.style.transition='transform .8s cubic-bezier(.45,.05,.85,.55)';w.style.transform=`translate(${p[0]}px,${p[1]}px) scale(.44)`;

    w.style.transition='none';w.style.opacity=0;pile(k,1);sparks(235+(p[0]-235)*1.28,492+(p[1]-6-492)*1.28,8,48,['#fff6a0','#ffd23d','#ffffff']);

  $('evWrap').onclick=()=>{const h=$('evHit');if(h&&h.onclick)h.onclick()};
  mood('idle');
}
function evolveHit(ok,q){
  const w=$('evWrap');
  if(!ok){if(!q){w.classList.remove('wob');void w.getBoundingClientRect();w.classList.add('wob');mood('sad',900)}return}
  if(w){w.innerHTML=evoArt(T.mode,score);if(!q){w.classList.remove('grow');void w.getBoundingClientRect();w.classList.add('grow')}}
  if(!q){sparks(235,340,9,58,['#fff6a0','#ff8787','#69db7c','#ffffff']);mood(score>=10?'joy':'happy',1200);checkStreak()}
}

/* ===== 7. Đua xe / Tên lửa / Tàu hỏa / Thuyền buồm ===== */
function vehicleSVG(mode){
  if(mode==='car')return `<g><rect x="-46" y="-12" width="92" height="26" rx="12" fill="#ff4d4d" stroke="#c92a2a" stroke-width="2.5"/><path d="M-24 -12L-10 -28L20 -28L32 -12Z" fill="#74c0fc" stroke="#c92a2a" stroke-width="2.5"/><circle cx="-26" cy="16" r="12" fill="#2b2d42"/><circle cx="-26" cy="16" r="5" fill="#dee2e6"/><circle cx="26" cy="16" r="12" fill="#2b2d42"/><circle cx="26" cy="16" r="5" fill="#dee2e6"/><rect x="18" y="-4" width="16" height="6" rx="3" fill="#ffe066"/></g>`;
  if(mode==='rocket')return `<g transform="rotate(42)"><path d="M-16 26L-28 42L-12 36ZM16 26L28 42L12 36Z" fill="#ff6b6b"/><path d="M0 -46C22 -24 22 14 16 32L-16 32C-22 14 -22 -24 0 -46Z" fill="#fff" stroke="#3b5bdb" stroke-width="2.5"/><path d="M0 -46C10 -34 14 -22 15 -14L-15 -14C-14 -22 -10 -34 0 -46Z" fill="#ff5252"/><circle cx="0" cy="-2" r="10" fill="#74c0fc" stroke="#3b5bdb" stroke-width="2.5"/><path class="flame" d="M-10 32Q0 56 10 32Z" fill="#ff922b"/></g>`;

  return `<g class="bobS"><path d="M-44 6L44 6L30 26L-30 26Z" fill="#d97724" stroke="#8d4912" stroke-width="2.5"/><rect x="-3" y="-44" width="6" height="50" fill="#8d5524"/><path d="M2 -42L38 2L2 2Z" fill="#ff6b6b"/><path d="M-3 -36L-32 2L-3 2Z" fill="#ffd43b"/></g>`;
}
function raceBgSVG(mode){
  if(mode==='rocket')return `${nightBgSVG()}<circle cx="342" cy="128" r="44" fill="#ffe066"/><circle cx="328" cy="116" r="8" fill="#fcc419"/><circle cx="356" cy="138" r="10" fill="#fcc419"/><circle cx="332" cy="144" r="5" fill="#fcc419"/><path d="M62 410Q200 260 342 128" stroke="#ffffff55" stroke-width="4" stroke-dasharray="10 10" fill="none"/>`;
  if(mode==='boat')return `${dayBgSVG({noGrass:true})}<rect x="-1500" y="310" width="3400" height="900" fill="#339af0"/><path class="wave" d="M-200 340Q-150 326 -100 340T0 340T100 340T200 340T300 340T400 340T500 340T600 340" stroke="#a5d8ff" stroke-width="5" fill="none"/><path class="wave" d="M-200 410Q-150 396 -100 410T0 410T100 410T200 410T300 410T400 410T500 410T600 410" stroke="#74c0fc" stroke-width="5" fill="none"/><ellipse cx="352" cy="316" rx="44" ry="16" fill="#ffe066"/><path d="M352 308Q362 278 374 268" stroke="#8d5524" stroke-width="5" fill="none"/><path d="M374 268Q356 264 350 276M374 268Q388 260 394 274" stroke="#40c057" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  return `${dayBgSVG({noGrass:true})}<rect x="-1500" y="318" width="3400" height="900" fill="#63c24a"/><rect x="-1500" y="346" width="3400" height="72" fill="#495057"/><line x1="-1500" y1="382" x2="1900" y2="382" stroke="#ffe066" stroke-width="5" stroke-dasharray="22 18"/><rect x="342" y="290" width="6" height="60" fill="#8d5524"/><rect x="348" y="290" width="34" height="22" fill="#fff" stroke="#2b2d42" stroke-width="2"/><rect x="348" y="290" width="17" height="11" fill="#2b2d42"/><rect x="365" y="301" width="17" height="11" fill="#2b2d42"/>`;
}
function racePos(mode,s){
  if(mode==='rocket')return [62+s*27,406-s*27];
  return [64+s*28,368];
}
function buildRace(mode){
  const p0=racePos(mode,0);
  sc.insertAdjacentHTML('beforeend',`<svg class="sv" viewBox="0 0 400 500" preserveAspectRatio="xMidYMax meet"><defs>${DEFS}</defs>
${raceBgSVG(mode)}
<g id="rcWrap" style="transform:translate(${p0[0]}px,${p0[1]}px);transition:transform .65s cubic-bezier(.3,1.3,.5,1)">
  <g id="rcIn" class="fb">${vehicleSVG(mode)}</g>
  <g id="rcHit" class="hitg"><circle r="64" fill="url(#gHalo)"/></g>
</g>
${robotG(6,384,.9)}
<g id="fx"></g></svg>`);
  $('rcIn').onclick=()=>{const h=$('rcHit');if(h&&h.onclick)h.onclick()};
  mood('idle');
}
function raceHit(ok,q){
  const w=$('rcWrap');
  if(!ok){if(!q){const c=$('rcIn');c.classList.remove('wob');void c.getBoundingClientRect();c.classList.add('wob');mood('sad',900)}return}
  const p=racePos(T.mode,score);
  if(w)w.style.transform=`translate(${p[0]}px,${p[1]}px)`;
  if(!q){sparks(p[0],p[1],8,46,['#fff6a0','#74c0fc','#ffffff']);mood(score>=10?'joy':'happy',1200);checkStreak()}
}

/* ===== 8. Bắn bóng bay / Đập chuột / Câu cá / Bóng rổ / Bowling / Phi thuyền ===== */
const SH_SPOTS=[[125,155],[180,145],[235,155],[290,145],[345,155],[125,235],[180,225],[235,235],[290,225],[345,235]];
function shootTargetSVG(mode,i,done){
  if(done){
    if(mode==='hoop')return `<g class="pop2"><use href="#starG" transform="scale(.55)"/></g>`;
    return '';
  }
  const cols=['#ff6b6b','#ffd43b','#51cf66','#4dabf7','#cc5de8'];
  const c=cols[i%cols.length];
  if(mode==='balloon')return `<g class="bobS"><ellipse cx="0" cy="-4" rx="20" ry="24" fill="${c}"/><ellipse cx="-7" cy="-12" rx="4" ry="7" fill="#fff" opacity=".55"/><path d="M0 20Q-4 32 2 42" stroke="#868e96" stroke-width="2" fill="none"/></g>`;
  if(mode==='mole')return `<g class="bobg"><ellipse cx="0" cy="18" rx="24" ry="7" fill="#5c3a21"/><path d="M-16 18L-16 -2C-16 -16 16 -16 16 -2L16 18Z" fill="#b07d4f"/><circle cx="-6" cy="-4" r="2.5" fill="#2b1d0e"/><circle cx="6" cy="-4" r="2.5" fill="#2b1d0e"/><ellipse cx="0" cy="2" rx="4.5" ry="3" fill="#ff8787"/></g>`;
  if(mode==='fish')return `<g class="bobS"><ellipse cx="0" cy="0" rx="20" ry="12" fill="${c}"/><path d="M18 0L30 -10L30 10Z" fill="${c}"/><circle cx="-9" cy="-2" r="2.5" fill="#2b1d0e"/></g>`;
  if(mode==='hoop')return `<g><rect x="-24" y="-22" width="48" height="32" rx="5" fill="#fff" stroke="#495057" stroke-width="2.5"/><rect x="-12" y="-12" width="24" height="16" fill="none" stroke="#ff6b6b" stroke-width="2"/><ellipse cx="0" cy="12" rx="16" ry="5" fill="none" stroke="#ff922b" stroke-width="4"/></g>`;
  if(mode==='bowling')return `<g><path d="M-8 22L-10 2Q-10 -8 -5 -14L-5 -22Q0 -26 5 -22L5 -14Q10 -8 10 2L8 22Z" fill="#fff" stroke="#adb5bd" stroke-width="2"/><rect x="-6" y="-14" width="12" height="4" fill="#f03e3e"/></g>`;
  return `<g class="bobg"><ellipse cx="0" cy="2" rx="22" ry="11" fill="#9775fa"/><path d="M-12 -2C-12 -16 12 -16 12 -2Z" fill="#a5d8ff"/><circle cx="-10" cy="4" r="2.5" fill="#ffe066"/><circle cx="0" cy="5" r="2.5" fill="#ffe066"/><circle cx="10" cy="4" r="2.5" fill="#ffe066"/></g>`;
}
function shooterSVG(mode){
  if(mode==='balloon')return `<path d="M-24 10Q0 -24 24 10" stroke="#8d5524" stroke-width="6" fill="none" stroke-linecap="round"/><line x1="-24" y1="10" x2="24" y2="10" stroke="#dee2e6" stroke-width="2.5"/>`;
  if(mode==='mole')return `<rect x="-6" y="-8" width="12" height="34" rx="5" fill="#d9822b"/><rect x="-20" y="-22" width="40" height="18" rx="6" fill="#ff6b6b"/>`;
  if(mode==='fish')return `<path d="M-22 24Q0 -16 26 -24" stroke="#8d5524" stroke-width="5" fill="none" stroke-linecap="round"/><line x1="26" y1="-24" x2="26" y2="10" stroke="#fff" stroke-width="2"/>`;
  if(mode==='hoop')return `<circle r="20" fill="#ff922b" stroke="#d9480f" stroke-width="2.5"/><path d="M-20 0H20M0 -20V20" stroke="#d9480f" stroke-width="2"/>`;
  if(mode==='bowling')return `<circle r="20" fill="#3b5bdb"/><circle cx="-5" cy="-6" r="2.5" fill="#fff"/><circle cx="4" cy="-6" r="2.5" fill="#fff"/><circle cx="0" cy="1" r="2.5" fill="#fff"/>`;
  return `<path d="M0 -28L18 16L0 8L-18 16Z" fill="#ff6b6b" stroke="#fff" stroke-width="2"/><circle cx="0" cy="-4" r="6" fill="#74c0fc"/>`;
}
function buildShoot(mode){
  const bg=mode==='alien'?nightBgSVG():mode==='fish'?`${dayBgSVG({noGrass:true})}<rect x="-1500" y="95" width="3400" height="900" fill="#339af0"/><ellipse cx="140" cy="180" rx="160" ry="70" fill="#4dabf7" opacity=".4"/>`:dayBgSVG();
  sc.insertAdjacentHTML('beforeend',`<svg class="sv" viewBox="0 0 400 500" preserveAspectRatio="xMidYMax meet"><defs>${DEFS}</defs>
${bg}
<g id="shSlots">${SH_SPOTS.map((p,i)=>`<g id="shNode${i}" transform="translate(${p[0]} ${p[1]})"><g id="shArt${i}">${shootTargetSVG(mode,i,false)}</g><g id="shHit${i}" class="hitg"><circle r="34" fill="url(#gHalo)"/></g></g>`).join('')}</g>
<g id="shooter" transform="translate(235 426)">${shooterSVG(mode)}</g>
${robotG(6,374,.95)}
<g id="fx"></g></svg>`);
  SH_SPOTS.forEach((_,i)=>{const n=$('shNode'+i);if(n)n.onclick=()=>{const h=$('shHit'+i);if(h&&h.onclick)h.onclick()}});
  mood('idle');
}
function shootHit(ok,q,i){
  const p=SH_SPOTS[i],art=$('shArt'+i),nd=$('shNode'+i);
  if(!ok){if(!q){const sh=$('shooter');sh.classList.remove('wob');void sh.getBoundingClientRect();sh.classList.add('wob');mood('sad',900)}return}
  if(q){if(art)art.innerHTML=shootTargetSVG(T.mode,i,true);if(T.mode!=='hoop'&&nd)nd.style.opacity=0;return}
  /* Đạn bay từ vị trí bắn tới mục tiêu */
  const proj=`<g id="proj" transform="translate(235 426)" style="transition:transform .42s ease-out"><circle r="10" fill="#ffd43b" stroke="#fff" stroke-width="3"/></g>`;
  const fx=$('fx');fx.insertAdjacentHTML('beforeend',proj);
  const pr=$('proj');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{if(pr)pr.style.transform=`translate(${p[0]}px,${p[1]}px)`}));
  setTimeout(()=>{
    if(pr)pr.remove();
    if(art)art.innerHTML=shootTargetSVG(T.mode,i,true);
    if(T.mode!=='hoop'&&nd){nd.style.transition='opacity .35s';nd.style.opacity=0}
    sparks(p[0],p[1],8,44,['#fff6a0','#ff6b6b','#74c0fc','#ffffff']);
    mood(score>=10?'joy':'happy',1200);checkStreak();
  },430);
}

/* ---------- Luồng chơi ---------- */
function start(){
  qs=[];const seen=new Set();let g=0;while(qs.length<10){const q=makeQ(),key=q.s+'|'+q.t+'|'+q.a;if(!seen.has(key)||g++>80){seen.add(key);qs.push(q)}}
  idx=0;score=0;res=[];locked=false;
  show('play');setup();renderQ();
}
function resume(){
  const g=S.game;if(!g)return start();
  topic=g.topic;range=g.range;qs=g.qs;idx=g.idx;score=g.score;res=g.res||[];locked=false;
  show('play');setup(g.th);
  let s=0;for(let i=0;i<idx;i++){if(res[i])s++;score=s;hit(res[i],1,i)}score=g.score;
  renderQ();
}
function renderQ(){
  const q=qs[idx];
  $('pg').style.width=(idx/10*100)+'%';
  $('sc').textContent=score;
  $('qs').textContent=`Câu ${idx+1}/10 · ${q.s}`;
  $('qem').innerHTML=q.em;
  $('qt').innerHTML=q.t;$('qt').className='t'+(q.sm?' sm':'');
  $('opts').className='opts'+(q.txt?' txt':'')+(q.o.length===2?' two':'');
  $('opts').innerHTML=q.o.map(v=>`<button class="opt" data-v="${esc(v)}">${oh(v)}</button>`).join('');
  $('tip').style.display='none';
  speak(q.say);
}
function toast(t,ok){
  const el=$('toast');el.textContent=t;el.className='show'+(ok?'':' bad');
  clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='',1500);
}
$('opts').onclick=e=>{
  const b=e.target.closest('.opt');if(!b||locked)return;locked=true;
  const q=qs[idx],v=b.dataset.v,ok=String(v)===String(q.a);
  res[idx]=ok;showTip(q);
  if(ok){
    score++;$('sc').textContent=score;b.classList.add('ok');
    toast(['Đúng rồi!','Tuyệt vời!','Giỏi quá!','Chính xác!'][rnd(0,3)],1);
    tone(523,.12);setTimeout(()=>tone(659,.18),110);
    hit(1);
    const go=()=>{idx++;if(idx<10){S.game={topic,range,qs,idx,score,res,th:TH.indexOf(T)};save();locked=false;renderQ()}else{S.game=null;finish()}};
    if(T.ms)tapStep(target(idx),go,T.ms);else setTimeout(go,1100);
  }else{
    b.classList.add('no');
    document.querySelectorAll('.opt').forEach(x=>{if(x.dataset.v===String(q.a))x.classList.add('ok')});
    toast('Chưa đúng!',0);tone(220,.25);hit(0);
    setTimeout(()=>{idx++;if(idx<10){S.game={topic,range,qs,idx,score,res,th:TH.indexOf(T)};save();locked=false;renderQ()}else{S.game=null;finish()}},q.tip?3000:1400);
  }
};
function finish(){
  $('pg').style.width='100%';
  S.stars+=score;const k=topic+'-'+range,o=S.stats[k]||{best:0,plays:0};S.stats[k]={best:Math.max(o.best,score),plays:o.plays+1};S.game=null;save();
  const st=score>=9?3:score>=6?2:1;
  $('rt').textContent=['Cố gắng nhé!','Khá lắm!','Tuyệt vời!'][st-1];
  $('rs').textContent=`Bé trả lời đúng ${score}/10 câu`;
  $('rst').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);
  $('rn').textContent=st<3?'Cố lên nhé!':'Xuất sắc!';
  $('rg').textContent=score;
  show('done');giveSticker();[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18),i*120));
}

/* ---------- Âm thanh (WebAudio + Giọng nói) ---------- */
let AC,music=true,mtimer;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d,v=.08){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
const MEL=[523,587,659,523,659,784,659,587,523,587,659,523,587,392];let mi=0;
function startMusic(){clearInterval(mtimer);mtimer=setInterval(()=>{if(music)tone(MEL[mi++%MEL.length],.22,.025)},420)}
$('musicBtn').onclick=()=>{music=!music;$('musicBtn').textContent='🎵 '+(music?'Bật':'Tắt');$('musicBtn').style.opacity=music?1:.6;if(music)startMusic()};
function speak(t){try{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}

$('start').onclick=()=>{ac();startMusic();start()};
$('resume').onclick=()=>{ac();startMusic();resume()};
$('spk').onclick=()=>speak(qs[idx].say);
$('quit').onclick=()=>{S.game=null;save();buildHome();show('home')};
$('again').onclick=start;
$('home2').onclick=()=>{buildHome();show('home')};
buildHome();
</script>
